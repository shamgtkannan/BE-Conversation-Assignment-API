# Local MongoDB and Kafka for development and the integration tests.
#
# A single-node replica set. The API needs a replica set name (majority write concern),
# and announcing the member as localhost:27017 means the host machine can reach it
# without any /etc/hosts entry. The replica set is initialised by the healthcheck, so
# `docker compose up -d --wait` returns once a primary is ready.
#
# Data is kept in the `mongo-data` volume. `docker compose down -v` wipes it.
#
# Kafka is one KRaft node (broker and controller in one process, no ZooKeeper) that
# announces itself as localhost:9092, so the host machine reaches it directly. It keeps
# no volume: a recreated container starts empty, which is fine for development.
services:
  mongo:
    image: mongo:8.0
    container_name: assignment-mongo
    command: ["mongod", "--replSet", "mongodb-test", "--bind_ip_all", "--port", "27017"]
    ports:
      # Loopback only: there is no authentication, so keep it off the network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiate the set on the first check (rs.status() throws until then), then
      # report healthy only once this node is the writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'mongodb-test', members: [{ _id: 0, host: 'localhost:27017' }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.0
    container_name: assignment-kafka
    ports:
      # Loopback only: there is no authentication, so keep it off the network.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # A single node: every internal topic can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
